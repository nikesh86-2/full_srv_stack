# Alertmanager Configuration
# See: https://prometheus.io/docs/alerting/latest/configuration/

global:
  resolve_timeout: 5m

# Templates for notifications
templates:
  - '/etc/alertmanager/template/*.tmpl'

# The root route on which each incoming alert enters
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true
    - match:
        severity: info
      receiver: 'info-alerts'

# Receivers define where alerts are sent
receivers:
  - name: 'default'
    # Configure your notification channels here
    # Example: email, Slack, Discord, PagerDuty, etc.
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager'
    #     auth_password: '${EMAIL_PASSWORD}'

  - name: 'critical-alerts'
    # Critical alerts - immediate notification
    # email_configs:
    #   - to: 'oncall@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager'
    #     auth_password: '${EMAIL_PASSWORD}'

  - name: 'warning-alerts'
    # Warning alerts - less urgent
    # email_configs:
    #   - to: 'team@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager'
    #     auth_password: '${EMAIL_PASSWORD}'

  - name: 'info-alerts'
    # Info alerts - log only or low-priority channel
    # webhook_configs:
    #   - url: 'http://webhook-logger:9000/alerts'

# Inhibition rules to suppress notifications
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  - source_match:
      alertname: 'HostDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']