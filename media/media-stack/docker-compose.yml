services:
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: vpn
    networks:
      - media
      - default
      - monitoring

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=wireguard

      - WIREGUARD_PRIVATE_KEY=${VPN_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${VPN_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${VPN_ADDRESSES}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${VPN_ENDPOINT_PORT}
      - FIREWALL_VPN_INPUT_PORTS=${VPN_FIREWALL_INPUT_PORTS}
      - FIREWALL_OUTBOUND_SUBNETS=${VPN_FIREWALL_SUBNETS}
      - DNS_UPSTREAM_RESOLVER_TYPE=doh
      - DNS_UPSTREAM_RESOLVERS=cloudflare,quad9
      - BLOCK_MALICIOUS=on
      - BLOCK_ADS=on
      - WIREGUARD_MTU=1280
      - TZ=${TZ}

    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

    volumes:
      - ${VPN_CONFIG_PATH}:/gluetun

    ports:
      - ${VPN_PORT_QB_1}:${VPN_PORT_QB_1}
      - ${VPN_PORT_SLSKD_TCP}:${VPN_PORT_SLSKD_TCP}
      - ${VPN_PORT_SLSKD_SSL}:${VPN_PORT_SLSKD_SSL}
      - ${BYPARR_PORT}:${BYPARR_PORT}
      - ${PROWLARR_PORT}:${PROWLARR_PORT}
      - 9050:9050
      - ${NEW_VPN_ENDPOINT_PORT}:${VPN_ENDPOINT_PORT}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "service:vpn"
    user: "${PUID}:${PGID}"

    environment:
      - SLSKD_UMASK=002
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}

    volumes:
      - ${SLSKD_CONFIG_PATH}:/app
      - ${DOWNLOADS_SOULSEEK}:/downloads
      - ${INCOMPLETE_SOULSEEK}:/incomplete

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    depends_on:
        vpn:
          condition: service_healthy

  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    network_mode: "service:vpn"

    environment:
      - PYTHONUNBUFFERED=1
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SCRIPT_INTERVAL=300

    volumes:
      - ${SOULARR_CONFIG_PATH}:/data
      - ${DOWNLOADS_SOULSEEK}:/downloads

    depends_on:
      - lidarr
      - slskd
      - vpn

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 32M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - WEBUI_PORT=${VPN_PORT_QB_1}

    volumes:
      - ${QBIT_CONFIG_PATH}:/config
      - ${DOWNLOADS_TORRENTS}:/downloads

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    depends_on:
        vpn:
          condition: service_healthy

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    networks:
      - media
      - monitoring

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${LIDARR_CONFIG_PATH}:/config
      - ${MEDIA_MUSIC}:/music
      - ${DOWNLOADS_SOULSEEK}:/downloads/soulseek
      - ${DOWNLOADS_TORRENTS}:/downloads/torrents

    ports:
      - ${LIDARR_PORT}:8686

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:vpn"

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${PROWLARR_CONFIG_PATH}:/config

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M
    depends_on:
        vpn:
          condition: service_healthy

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - media
      - monitoring

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${SONARR_CONFIG_PATH}:/config
      - ${MEDIA_TV}:/tv
      - ${DOWNLOADS_TV}:/downloads/tv

    ports:
      - ${SONARR_PORT}:8989

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - media
      - monitoring

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${RADARR_CONFIG_PATH}:/config
      - ${MEDIA_MOVIES}:/movies
      - ${DOWNLOADS_MOVIES}:/downloads/movies

    ports:
      - ${RADARR_PORT}:7878

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

  audiobookrequest:
    image: markbeep/audiobookrequest:latest
    container_name: audiobookrequest
    networks:
      - media
      - monitoring

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ABR_APP__PORT=${ABR_PORT}

    volumes:
      - ${ABR_CONFIG_PATH}:/config
      - ${DOWNLOADS_AUDIOBOOKS}:/downloads

    ports:
      - ${ABR_PORT}:${ABR_PORT}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    network_mode: "service:vpn"
    shm_size: "1gb"

    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=${TZ}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    networks:
      - monitoring

    environment:
      - TZ=${TZ}

    volumes:
      - ${AUDIOBOOKSHELF_CONFIG}:/config
      - ${AUDIOBOOKSHELF_METADATA}:/metadata
      - ${DOWNLOADS_AUDIOBOOKS}:/media/audiobooks
      - ${DOWNLOADS_PODCASTS}:/media/podcasts

    ports:
      - ${AUDIOBOOKSHELF_PORT}:80

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    networks:
      - media
      - monitoring

    user: "${PUID}:${PGID}"

    environment:
      - TZ=${TZ}

    devices:
      - /dev/dri:/dev/dri

    volumes:
      - /mnt/jellyfin/jelly-config:/config
      - /mnt/jellyfin/jellyfin_cache:/cache
      - /mnt/jellyfin/jellyfin_log:/log
      - ${MEDIA_MUSIC}:/media/Music
      - ${MEDIA_MOVIES}:/media/Movies
      - ${MEDIA_TV}:/media/TV
      - ${MEDIA2MOVIES}:/media/Movies2
      - ${MEDIA2TV}:/media/TV2
      - ${MEDIA_POD}:/media/Podcasts
      - ${MEDIA_AUDIOBOOKS}:/media/Audiobooks
    ports:
      - ${JELLYFIN_PORT}:8096

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M

networks:
  media:
    external: true
  monitoring:
    external: true
