services:
  home-assistant:
    container_name: home-assistant
    image: ghcr.io/home-assistant/home-assistant:latest
    restart: unless-stopped
    privileged: true
    # Using host mode to allow for mDNS/UPnP discovery of local IoT devices
    network_mode: host
    cap_add:
      - NET_ADMIN # Required for network management
      - NET_RAW   # Required for certain discovery protocols
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M

  music-assistant:
    container_name: music-assistant
    image: ghcr.io/music-assistant/server:latest
    user: "${PUID}:${PGID}"
    # Host mode required for casting (AirPlay/Google Cast) across subnets
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./ma-config/data:/data
      - ${MUSIC_PATH}:/music:ro # NAS integration via NFS/SMB mount, using .env variable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    depends_on:
      - home-assistant

  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./whisper-data:/data
    command: --model tiny-int8 --language en
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./piper-data:/data
    command: --voice en_GB-alba-medium
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M
