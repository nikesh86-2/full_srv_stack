services:

  # --------------------------------------------------
  # Pi-hole
  # Network-wide ad blocking DNS server
  # --------------------------------------------------
  pihole:
    image: pihole/pihole:latest
    container_name: pihole

    networks:
      pihole_ipvlan:
        ipv4_address: ${PIHOLE_IP}
      monitoring:

    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}

    volumes:
      # Pi-hole configuration
      - ${PIHOLE_CONFIG_PATH}:/etc/pihole

      # DNS logs
      - ${PIHOLE_LOG_PATH}:/var/log/pihole

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

# --------------------------------------------------
# Networks
# --------------------------------------------------
networks:

  # Static IP network for Pi-hole
  pihole_ipvlan:
    external: true

  # Monitoring network for Prometheus/Loki
  monitoring:
    external: true
