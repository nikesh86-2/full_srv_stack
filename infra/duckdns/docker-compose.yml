services:

  # --------------------------------------------------
  # DuckDNS
  # Dynamic DNS updater for DuckDNS domains
  # --------------------------------------------------
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns

    # Host networking allows accurate public IP detection
    network_mode: host

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

      # Comma-separated list of DuckDNS subdomains
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}

      # DuckDNS API token
      - TOKEN=${DUCKDNS_TOKEN}

      # Enable logging
      - LOG_FILE=true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 16M
