# Monitoring Stack: Loki + Prometheus + Grafana
# Deploy: docker compose -f /srv/infra/monitoring/docker-compose.yml up -d
#
# Services:
#   - loki: Log aggregation (port 3100)
#   - prometheus: Metrics collection (port 9090)
#   - grafana: Dashboards & visualization (port 3000)
#   - promtail: Log shipper (scrapes Docker logs -> Loki)
#   - node-exporter: Host metrics (port 9100)
#   - cadvisor: Container metrics (port 8080)
#
# Access:
#   Grafana: http://<host>:3000  (admin / from .env)
#   Prometheus: http://<host>:9090
#   Loki: http://<host>:3100
#   cAdvisor: http://<host>:8080

services:
  # --------------------------------------------------
  # Loki - Log Aggregation
  # --------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - ${LOKI_DATA_PATH:-/mnt/monitoring/loki}:/loki
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - monitoring

  # --------------------------------------------------
  # Promtail - Log Shipper (Docker -> Loki)
  # --------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 32M
    networks:
      - monitoring
    depends_on:
      - loki

  # --------------------------------------------------
  # Prometheus - Metrics Collection
  # --------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ${PROMETHEUS_DATA_PATH:-/mnt/monitoring/prometheus}:/prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --------------------------------------------------
  # Alertmanager - Alert Routing (optional)
  # --------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_DATA_PATH:-/mnt/monitoring/alertmanager}:/alertmanager
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 32M
    networks:
      - monitoring

  # --------------------------------------------------
  # Grafana - Dashboards & Visualization
  # --------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${GRAFANA_DATA_PATH:-/mnt/monitoring/grafana}:/var/lib/grafana
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M
    networks:
      - monitoring
    depends_on:
      - loki
      - prometheus
      - alertmanager

  # --------------------------------------------------
  # Node Exporter - Host Metrics
  # --------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 32M

  # --------------------------------------------------
  # cAdvisor - Container Metrics
  # --------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "${CADVISOR_PORT:-8082}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring
    external: false
